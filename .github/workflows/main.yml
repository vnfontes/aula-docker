import java.util.Scanner;

class Employee {
    int employeeId;
    String name;
    double salary;

    Employee(int employeeId, String name, double salary) {
        this.employeeId = employeeId;
        this.name = name;
        this.salary = salary;
    }

    double calculateNewSalary() {
        return salary;
    }

    void display() {
        System.out.println("Employee ID : " + employeeId);
        System.out.println("Name : " + name);
        System.out.printf("Old Salary : %.2f%n", salary);
        System.out.printf("New Salary : %.2f%n",
                          calculateNewSalary());
        System.out.println("----------------------------");
    }
}

class Manager extends Employee {
    Manager(int employeeId, String name, double salary) {
        super(employeeId, name, salary);
    }

    @Override
    double calculateNewSalary() {
        return salary + (salary * 0.40);
    }
}

class Developer extends Employee {
    Developer(int employeeId, String name, double salary) {
        super(employeeId, name, salary);
    }

    @Override
    double calculateNewSalary() {
        return salary + (salary * 0.25);
    }
}

class Programmer extends Employee {
    Programmer(int employeeId, String name, double salary) {
        super(employeeId, name, salary);
    }

    @Override
    double calculateNewSalary() {
        return salary + (salary * 0.10);
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.print("Enter Employee ID: ");
        int id = sc.nextInt();
        sc.nextLine();

        System.out.print("Enter Employee Name: ");
        String name = sc.nextLine();

        System.out.print("Enter Current Salary: ");
        double salary = sc.nextDouble();

        System.out.println("\nSelect Employee Role:");
        System.out.println("1. Manager");
        System.out.println("2. Developer");
        System.out.println("3. Programmer");
        System.out.print("Enter choice: ");

        int choice = sc.nextInt();
        Employee employee;

        switch (choice) {
            case 1:
                employee = new Manager(id, name, salary);
                break;
            case 2:
                employee = new Developer(id, name, salary);
                break;
            case 3:
                employee = new Programmer(id, name, salary);
                break;
            default:
                System.out.println("Invalid role.");
                sc.close();
                return;
        }

        System.out.println("\n===== APPRAISAL DETAILS =====");
        employee.display();

        sc.close();
    }
}

